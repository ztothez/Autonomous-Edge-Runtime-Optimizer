<text x="125.0" y="104" font-size="12" fill="#555" text-anchor="middle" font-weight="400">Zephyr firmware</text>
<text x="200" y="135" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="600">3V3</text>
<circle cx="210" cy="130" r="4.5" fill="#d33" stroke="#ffffff" stroke-width="1.5"/>
<text x="200" y="185" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="600">GND</text>
<circle cx="210" cy="180" r="4.5" fill="#222" stroke="#ffffff" stroke-width="1.5"/>
<text x="200" y="235" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="600">P0.26 (SDA)</text>
<circle cx="210" cy="230" r="4.5" fill="#2a6fd6" stroke="#ffffff" stroke-width="1.5"/>
<text x="200" y="285" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="600">P0.27 (SCL)</text>
<circle cx="210" cy="280" r="4.5" fill="#1d9a5a" stroke="#ffffff" stroke-width="1.5"/>
<rect x="640" y="56" width="280" height="234" rx="10" fill="#f6f6f4" stroke="#555" stroke-width="1.5"/>
