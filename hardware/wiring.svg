<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 715" width="960" height="715" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="715" fill="#ffffff"/>
<text x="40" y="34" font-size="20" fill="#1a1a1a" text-anchor="start" font-weight="700">Wiring: nRF52833 DK, GY-521 (MPU-6050), BMP280</text>
