<text x="780.0" y="100" font-size="12" fill="#555" text-anchor="middle" font-weight="400">I2C address 0x68</text>
<rect x="640" y="310" width="280" height="254" rx="10" fill="#f6f6f4" stroke="#555" stroke-width="1.5"/>
<text x="780.0" y="336" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">BMP280 breakout (purple)</text>
<text x="780.0" y="354" font-size="12" fill="#555" text-anchor="middle" font-weight="400">I2C address 0x76, chip ID 0x58</text>
<line x1="300" y1="130" x2="300" y2="534" stroke="#d33" stroke-width="2.5" stroke-linecap="round"/>
<text x="300" y="120" font-size="11" fill="#d33" text-anchor="middle" font-weight="700">3V3</text>
<line x1="335" y1="160" x2="335" y2="504" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<text x="335" y="150" font-size="11" fill="#222" text-anchor="middle" font-weight="700">GND</text>
<line x1="405" y1="190" x2="405" y2="444" stroke="#1d9a5a" stroke-width="2.5" stroke-linecap="round"/>
<text x="405" y="180" font-size="11" fill="#1d9a5a" text-anchor="middle" font-weight="700">SCL</text>
<line x1="370" y1="220" x2="370" y2="474" stroke="#2a6fd6" stroke-width="2.5" stroke-linecap="round"/>
<text x="370" y="210" font-size="11" fill="#2a6fd6" text-anchor="middle" font-weight="700">SDA</text>
<line x1="210" y1="130" x2="300" y2="130" stroke="#d33" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="300" cy="130" r="4.5" fill="#d33" stroke="#ffffff" stroke-width="1.5"/>
<line x1="210" y1="180" x2="335" y2="180" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="335" cy="180" r="4.5" fill="#222" stroke="#ffffff" stroke-width="1.5"/>
<line x1="210" y1="230" x2="370" y2="230" stroke="#2a6fd6" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="370" cy="230" r="4.5" fill="#2a6fd6" stroke="#ffffff" stroke-width="1.5"/>
<line x1="210" y1="280" x2="405" y2="280" stroke="#1d9a5a" stroke-width="2.5" stroke-linecap="round"/>
