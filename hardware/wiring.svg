<text x="654" y="135" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">VCC</text>
<line x1="335" y1="160" x2="640" y2="160" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="335" cy="160" r="4.5" fill="#222" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="640" cy="160" r="4.5" fill="#222" stroke="#ffffff" stroke-width="1.5"/>
<text x="654" y="165" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">GND</text>
<line x1="405" y1="190" x2="640" y2="190" stroke="#1d9a5a" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="405" cy="190" r="4.5" fill="#1d9a5a" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="640" cy="190" r="4.5" fill="#1d9a5a" stroke="#ffffff" stroke-width="1.5"/>
<text x="654" y="195" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">SCL</text>
<line x1="370" y1="220" x2="640" y2="220" stroke="#2a6fd6" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="370" cy="220" r="4.5" fill="#2a6fd6" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="640" cy="220" r="4.5" fill="#2a6fd6" stroke="#ffffff" stroke-width="1.5"/>
<text x="654" y="225" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">SDA</text>
<line x1="335" y1="250" x2="640" y2="250" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="335" cy="250" r="4.5" fill="#222" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="640" cy="250" r="4.5" fill="#222" stroke="#ffffff" stroke-width="1.5"/>
<text x="654" y="255" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">AD0</text>
<line x1="300" y1="384" x2="640" y2="384" stroke="#d33" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="300" cy="384" r="4.5" fill="#d33" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="640" cy="384" r="4.5" fill="#d33" stroke="#ffffff" stroke-width="1.5"/>
<text x="654" y="389" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">VCC</text>
<line x1="335" y1="414" x2="640" y2="414" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="335" cy="414" r="4.5" fill="#222" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="640" cy="414" r="4.5" fill="#222" stroke="#ffffff" stroke-width="1.5"/>
<text x="654" y="419" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">GND</text>
<line x1="405" y1="444" x2="640" y2="444" stroke="#1d9a5a" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="405" cy="444" r="4.5" fill="#1d9a5a" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="640" cy="444" r="4.5" fill="#1d9a5a" stroke="#ffffff" stroke-width="1.5"/>
<text x="654" y="449" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">SCL</text>
<line x1="370" y1="474" x2="640" y2="474" stroke="#2a6fd6" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="370" cy="474" r="4.5" fill="#2a6fd6" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="640" cy="474" r="4.5" fill="#2a6fd6" stroke="#ffffff" stroke-width="1.5"/>
<text x="654" y="479" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">SDA</text>
<line x1="335" y1="504" x2="640" y2="504" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="335" cy="504" r="4.5" fill="#222" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="640" cy="504" r="4.5" fill="#222" stroke="#ffffff" stroke-width="1.5"/>
<text x="654" y="509" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">SDO</text>
<line x1="300" y1="534" x2="640" y2="534" stroke="#d33" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="300" cy="534" r="4.5" fill="#d33" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="640" cy="534" r="4.5" fill="#d33" stroke="#ffffff" stroke-width="1.5"/>
<text x="654" y="539" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">CSB</text>
<text x="40" y="590" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Notes</text>
<text x="40" y="612" font-size="12.5" fill="#555" text-anchor="start" font-weight="400">• Shared I2C bus: SDA and SCL each go to both the GY-521 and the BMP280.</text>
<text x="40" y="632" font-size="12.5" fill="#555" text-anchor="start" font-weight="400">• BMP280: SDO to GND selects address 0x76, CSB to 3V3 selects I2C mode.</text>
<text x="40" y="652" font-size="12.5" fill="#555" text-anchor="start" font-weight="400">• GY-521: AD0 to GND selects address 0x68.</text>
<text x="40" y="672" font-size="12.5" fill="#555" text-anchor="start" font-weight="400">• A DHT11 (humidity) was tried on P0.03 and removed; see the README.</text>
<text x="40" y="692" font-size="12.5" fill="#555" text-anchor="start" font-weight="400">• Everything runs from the DK's 3V3 and GND pins. No 5 V.</text>
</svg>