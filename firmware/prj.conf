# Zephyr Project Configuration File

# --- Logging ---
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y

# --- Bluetooth ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="EdgeOpt"

# --- Sensors & Hardware ---
CONFIG_SENSOR=y
CONFIG_ADC=y

# --- Floating Point Support ---
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- DHT11 ---
CONFIG_DHT=y